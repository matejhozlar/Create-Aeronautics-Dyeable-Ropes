name: Build

on:
  pull_request:
    branches:
      - 1.21.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Extract bundled Simulated jar
        run: |
          ./gradlew extractSimulated
          echo "=== build/extracted-simulated ==="
          ls -la build/extracted-simulated/ || true
          test -f build/extracted-simulated/simulated.jar

      - name: Generate derived assets
        env:
          SIMULATED_JAR: build/extracted-simulated/simulated.jar
        run: |
          pip install --quiet Pillow
          python scripts/recolor_ropes.py
          python scripts/generate_jsons.py

      - name: Build with Gradle
        run: ./gradlew build
